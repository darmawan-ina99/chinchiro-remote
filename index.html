<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<meta name="theme-color" content="#0d1117">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>ChinChiro Remote — ADE-Labs Digital</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; font-family:system-ui,sans-serif; }
  body { background:#0d1117; color:#e6edf3; min-height:100vh; padding:16px 14px 30px; max-width:420px; margin:0 auto; }
  .brand { text-align:center; padding:10px 0 12px; margin-bottom:14px; border-bottom:1px solid #30363d; }
  .brand .t { font-size:15px; font-weight:800; letter-spacing:3px; color:#58a6ff; }
  .brand .s { font-size:10px; color:#8b949e; letter-spacing:4px; margin-top:2px; }
  .hdr { display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; }
  .hdr h1 { font-size:17px; letter-spacing:1px; }
  .dot { width:10px; height:10px; border-radius:50%; background:#f0883e; display:inline-block; margin-right:6px; }
  .dot.ok { background:#3fb950; }
  .status { background:#161b22; border:1px solid #30363d; border-radius:12px; padding:14px; margin-bottom:14px; }
  .status .lbl { font-size:11px; color:#8b949e; text-transform:uppercase; letter-spacing:1px; }
  .status .val { font-size:26px; font-weight:700; margin-top:2px; }
  .status .dice { font-size:34px; margin-top:6px; line-height:1; }
  .status .upd { font-size:11px; color:#8b949e; margin-top:8px; }
  .card { background:#161b22; border:1px solid #30363d; border-radius:12px; padding:14px; margin-bottom:14px; }
  .card h2 { font-size:12px; color:#8b949e; text-transform:uppercase; letter-spacing:1px; margin-bottom:10px; }
  .modes { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .mode { padding:14px 8px; border-radius:10px; border:1px solid #30363d; background:#21262d; color:#e6edf3; font-size:14px; font-weight:600; cursor:pointer; }
  .mode small { display:block; font-weight:400; font-size:11px; color:#8b949e; margin-top:2px; }
  .mode.on { border-color:#3fb950; background:#13241a; }
  .die-lbl { font-size:12px; color:#8b949e; margin:10px 0 4px; }
  .faces { display:grid; grid-template-columns:repeat(7,1fr); gap:4px; }
  .fc { aspect-ratio:1; border-radius:8px; border:1px solid #30363d; background:#21262d; font-size:18px; cursor:pointer; display:flex; align-items:center; justify-content:center; }
  .fc.auto { font-size:10px; color:#8b949e; }
  .fc.on { border-color:#58a6ff; background:#0d2438; }
  .presets { display:flex; flex-wrap:wrap; gap:6px; }
  .pre { padding:8px 12px; border-radius:20px; border:1px solid #30363d; background:#21262d; font-size:13px; cursor:pointer; }
  .set { width:100%; padding:16px; border:none; border-radius:12px; background:#238636; color:#fff; font-size:16px; font-weight:700; letter-spacing:2px; cursor:pointer; margin-top:4px; }
  .set:active { background:#2ea043; }
  .pinrow { display:flex; gap:8px; align-items:center; }
  .pinrow input { flex:1; background:#0d1117; border:1px solid #30363d; color:#e6edf3; border-radius:8px; padding:12px; font-size:16px; letter-spacing:4px; text-align:center; }
  .toast { position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:#238636; color:#fff; padding:10px 22px; border-radius:20px; font-size:14px; font-weight:600; opacity:0; transition:opacity .3s; pointer-events:none; max-width:90%; }
  .toast.err { background:#da3633; }
  .toast.show { opacity:1; }
</style>
</head>
<body>
<div class="brand"><div class="t">ADE-Labs Digital</div><div class="s">CHINCHIRO REMOTE CONTROL</div></div>
<div class="hdr"><h1 style="font-size:13px;color:#8b949e">&#127922; PANEL OPERATOR</h1><span><span class="dot" id="dot"></span><span id="conntxt" style="font-size:11px;color:#8b949e">cek...</span></span></div>

<div class="status">
  <div class="lbl">Status Kontrol</div>
  <div class="val" id="statMode">OFF</div>
  <div class="dice" id="statDice"></div>
  <div class="upd" id="statUpd">belum sinkron</div>
</div>

<div class="card">
  <h2>PIN Operator</h2>
  <div class="pinrow"><input type="password" id="pin" inputmode="numeric" maxlength="8" placeholder="PIN"></div>
</div>

<div class="card">
  <h2>Mode</h2>
  <div class="modes">
    <button class="mode on" data-mode="off">OFF<small>dadu normal</small></button>
    <button class="mode" data-mode="shigoro">SHIGORO<small>paksa 4-5-6</small></button>
    <button class="mode" data-mode="pinzoro">PINZORO<small>paksa 1-1-1</small></button>
    <button class="mode" data-mode="custom">CUSTOM<small>pilih dadu sendiri</small></button>
  </div>
</div>

<div class="card">
  <h2>Dadu Custom (mode CUSTOM)</h2>
  <div id="diceBox"></div>
  <h2 style="margin-top:14px">Preset Cepat</h2>
  <div class="presets" id="presets"></div>
</div>

<button class="set" id="setBtn">SET DADU</button>
<div class="toast" id="toast"></div>

<script>
const API = "https://solene-copy-808ddc96.base44.app/functions/chinchiroDiceControl";
const FACE = ["&#x2680;","&#x2681;","&#x2682;","&#x2683;","&#x2684;","&#x2685;"];
const MODE_TXT = {off:"OFF (normal)",shigoro:"SHIGORO",pinzoro:"PINZORO",custom:"CUSTOM"};
let selMode = "off", d = [0,0,0];

const $ = id => document.getElementById(id);
let saved = localStorage.getItem("cchPin") || "";
$("pin").value = saved;
$("pin").addEventListener("change", () => localStorage.setItem("cchPin", $("pin").value));

// pilihan dadu
for (let i=0;i<3;i++){
  const lbl = document.createElement("div"); lbl.className="die-lbl"; lbl.textContent="Dadu "+(i+1); $("diceBox").appendChild(lbl);
  const row = document.createElement("div"); row.className="faces";
  const auto = document.createElement("button"); auto.className="fc auto on"; auto.dataset.v=0; auto.textContent="auto"; row.appendChild(auto);
  for (let v=1;v<=6;v++){ const b=document.createElement("button"); b.className="fc"; b.dataset.v=v; b.innerHTML=FACE[v-1]; row.appendChild(b); }
  row.addEventListener("click", e => {
    const t = e.target.closest(".fc"); if(!t) return;
    d[i] = +t.dataset.v;
    if (selMode !== "custom") { selMode = "custom"; paintModes(); }
    [...row.children].forEach(c=>c.classList.toggle("on", c===t));
  });
  $("diceBox").appendChild(row);
}

// preset cepat
[["4-5-6 shigoro",[4,5,6]],["6-6-6",[6,6,6]],["5-5-5",[5,5,5]],["1-1-1 pinzoro",[1,1,1]],["1-2-3 (kalah)",[1,2,3]],["2-2-2",[2,2,2]]].forEach(([txt,vals])=>{
  const b=document.createElement("button"); b.className="pre"; b.textContent=txt;
  b.onclick=()=>{ selMode="custom"; d=[...vals]; paintModes(); paintDice(); sendSet(); };
  $("presets").appendChild(b);
});

// pilihan mode
document.querySelectorAll(".mode").forEach(m=>m.onclick=()=>{
  selMode=m.dataset.mode;
  if(selMode==="shigoro") d=[4,5,6];
  if(selMode==="pinzoro") d=[1,1,1];
  paintModes(); paintDice(); sendSet();
});

function paintModes(){ document.querySelectorAll(".mode").forEach(m=>m.classList.toggle("on", m.dataset.mode===selMode)); }
function paintDice(){
  const rows = document.querySelectorAll(".faces");
  for(let i=0;i<3;i++) [...rows[i].children].forEach(c=>c.classList.toggle("on", +c.dataset.v===d[i]));
}

function toast(msg, err){
  const t=$("toast"); t.textContent=msg; t.className="toast show"+(err?" err":"");
  setTimeout(()=>t.className="toast"+(err?" err":""), 2200);
}

async function refresh(){
  try{
    const r = await fetch(API);
    if(!r.ok) throw 0;
    const j = await r.json();
    $("dot").className="dot ok"; $("conntxt").textContent="online";
    $("statMode").textContent = MODE_TXT[j.mode] || j.mode;
    $("statMode").style.color = j.mode==="off" ? "#f85149" : "#3fb950";
    let dd=[j.d1,j.d2,j.d3];
    if(j.mode==="shigoro") dd=[4,5,6];
    if(j.mode==="pinzoro") dd=[1,1,1];
    $("statDice").innerHTML = j.mode==="off" ? "" :
      dd.map(v=>v>0?FACE[v-1]:"&#x1F518;").join(" ");
    $("statUpd").textContent = "update terakhir: " + (j.updated_at ? new Date(j.updated_at).toLocaleTimeString("id-ID") : "-");
  }catch(_e){ $("dot").className="dot"; $("conntxt").textContent="offline"; }
}
setInterval(refresh, 3000); refresh();

async function sendSet(){
  const pin = $("pin").value.trim();
  if(!pin){ toast("isi PIN dulu", true); return; }
  $("setBtn").textContent = "MENGIRIM..."; $("setBtn").disabled = true;
  try{
    const r = await fetch(API, { method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({ pin, mode: selMode, d1: d[0], d2: d[1], d3: d[2] }) });
    const j = await r.json();
    if(r.ok && j.ok){
      toast(selMode==="off" ? "TERSIMPAN: DADU NORMAL (OFF)" : "TERSIMPAN: " + MODE_TXT[selMode] + " " + d.map(v=>v>0?v:"?").join("-"));
      refresh();
    }
    else toast(j.error || "gagal", true);
  }catch(_e){ toast("jaringan bermasalah", true); }
  $("setBtn").textContent = "SET DADU"; $("setBtn").disabled = false;
}
$("setBtn").onclick = sendSet;
</script>
</body>
</html>
